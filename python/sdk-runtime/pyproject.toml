[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "lasmex-runtime-bin"
version = "0.1.0"
description = "Pinned LasmeX runtime for the Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "LasmeX contributors" }]

[project.urls]
Homepage = "https://github.com/lasme-ephrem/LasmeX"
Repository = "https://github.com/lasme-ephrem/LasmeX"
Issues = "https://github.com/lasme-ephrem/LasmeX/issues"
Source = "https://github.com/lasme-ephrem/LasmeX"
Upstream = "https://github.com/deepseek-ai/deepseek-harness"

# Include the injected executable and default config; exclude the dev-only node
# closure from wheels and sdists.
[tool.hatch.build]
artifacts = ["src/lasmex_runtime/runtime/lasmex-jsonrpc-agent-*"]
exclude = ["src/lasmex_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/lasmex_runtime"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
