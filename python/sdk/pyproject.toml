[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "lasmex-sdk"
version = "0.1.0"
description = "Python SDK for LasmeX"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "LasmeX contributors" }]
dependencies = [
  "pydantic>=2.12,<3",
  "lasmex-runtime-bin==0.1.0",
]

[project.urls]
Homepage = "https://github.com/lasme-ephrem/LasmeX"
Repository = "https://github.com/lasme-ephrem/LasmeX"
Issues = "https://github.com/lasme-ephrem/LasmeX/issues"
Source = "https://github.com/lasme-ephrem/LasmeX"
Upstream = "https://github.com/deepseek-ai/deepseek-harness"

[dependency-groups]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/lasmex"]

# Editable installs see runtime executables injected after installation instead
# of freezing a wheel snapshot.
[tool.uv.sources]
lasmex-runtime-bin = { path = "../sdk-runtime", editable = true }
