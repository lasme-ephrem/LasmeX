# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: 'lasmex-system-prompt'

- id: tools
  name: 'lasmex-tools'

- id: subprocess
  name: 'lasmex-subprocess-local'

- id: bash
  name: 'lasmex-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: 'lasmex-shell-env'

- id: tasks
  name: 'lasmex-jobs-local'

- id: tool-jobs
  name: 'lasmex-tool-jobs'

- id: tool-pwsh
  name: 'lasmex-tool-pwsh'
