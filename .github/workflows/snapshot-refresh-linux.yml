name: Refresh snapshot fixtures on Linux

# One-off keyless fixture refresh on Linux, where the posix-only scenarios
# replay. Triggered by a push whose commit message carries SNAPSHOT_REFRESH;
# the refresh writes updated expected outputs and pushes them back with a
# plain message so the workflow does not retrigger itself.
on:
  push:
    branches: [codex/lasmex-foundation]

permissions:
  contents: write

jobs:
  refresh:
    if: contains(github.event.head_commit.message, 'SNAPSHOT_REFRESH')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Refresh snapshot fixtures
        run: DSH_SNAPSHOT=refresh pnpm exec vitest run --config vitest.snapshot.config.ts

      - name: Commit and push refreshed fixtures
        run: |
          git config user.name "lasmex-fixture-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "test(snapshot): refresh fixtures on Linux"
          git push
