name: Release (Python)

# A PR labeled python-release-dry-run or a manual run builds and validates the
# complete wheel set without registry credentials. The unified LasmeX release
# workflow owns PyPI trusted publishing and consumes these same build steps.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: python-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build four wheels
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'python-release-dry-run'
    uses: ./.github/workflows/build-exe-for-python-sdk.yml
    with:
      targets: node24-linux-x64,node24-linux-arm64,node24-macos-arm64
      release: true

  python-compat:
    name: Python ${{ matrix.python }} / installed SDK
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: lasmex_*
          path: dist
          merge-multiple: true

      - name: Resolve installed wheel version
        id: compatibility-version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import runpy

          release = runpy.run_path("scripts/build-python-release.py")
          repository_version = release["repository_version"]()
          print(f"version={release['pep440_version'](repository_version)}")
          PY

      - name: Install and run the published entry path
        run: |
          python -m pip install --find-links dist "lasmex-sdk==${{ steps.compatibility-version.outputs.version }}"
          python scripts/smoke-python-runtime.py --scenario sdk-default

  validate:
    name: Validate release candidate
    needs: [build, python-compat]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.10'

      - name: Resolve release version
        id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import runpy

          release = runpy.run_path("scripts/build-python-release.py")
          repository_version = release["repository_version"]()
          wheel_version = release["pep440_version"](repository_version)
          print(f"repository-version={repository_version}")
          print(f"version={wheel_version}")
          PY

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: lasmex_*
          path: dist
          merge-multiple: true

      - name: Check release contents
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          expected="$(mktemp)"
          actual="$(mktemp)"
          printf '%s\n' \
            "lasmex_runtime_bin-$VERSION-py3-none-macosx_14_0_arm64.whl" \
            "lasmex_runtime_bin-$VERSION-py3-none-manylinux_2_28_aarch64.whl" \
            "lasmex_runtime_bin-$VERSION-py3-none-manylinux_2_28_x86_64.whl" \
            "lasmex_sdk-$VERSION-py3-none-any.whl" > "$expected"
          find dist -maxdepth 1 -type f -name '*.whl' -exec basename {} \; | sort > "$actual"
          diff -u "$expected" "$actual"
          while IFS= read -r wheel; do
            size="$(stat -c '%s' "dist/$wheel")"
            [ "$size" -lt 100000000 ] || {
              echo "::error::$wheel is $size bytes; public PyPI accepts at most 100000000 bytes by default."
              exit 1
            }
          done < "$actual"

      - name: Validate package metadata
        run: |
          python -m pip install twine==6.2.0
          python -m twine check dist/*.whl

      - name: Record artifact hashes
        run: |
          cd dist
          sha256sum *.whl | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-release-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
