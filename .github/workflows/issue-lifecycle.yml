name: Issue lifecycle

on:
  issues:
    types:
      - opened
      - edited
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - closed
      - reopened
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - review_requested
  pull_request_review:
    types:
      - submitted

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: issue-lifecycle-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  lifecycle:
    name: Issue lifecycle
    if: >-
      ${{
        github.actor != 'dependabot[bot]' &&
        (
          github.event_name == 'issues' ||
          (
            github.event_name == 'pull_request_target' &&
            (
              github.event.pull_request.head.repo.full_name == github.repository ||
              github.event.action == 'review_requested'
            )
          ) ||
          (
            github.event_name == 'pull_request_review' &&
            github.event.action == 'submitted' &&
            github.event.review.state == 'changes_requested' &&
            github.event.pull_request.head.repo.full_name == github.repository
          )
        )
      }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Handle repository event
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/issue-management/policy.mjs lifecycle
