name: Build desktop distributions

on:
  workflow_call:
    inputs:
      release:
        description: Build signed release artifacts instead of unsigned test artifacts.
        type: boolean
        required: false
        default: false
    secrets:
      LASMEX_WINDOWS_CERTIFICATE_PFX_BASE64:
        required: false
      LASMEX_WINDOWS_CERTIFICATE_PASSWORD:
        required: false
      LASMEX_MACOS_CERTIFICATE_P12_BASE64:
        required: false
      LASMEX_MACOS_CERTIFICATE_PASSWORD:
        required: false
      LASMEX_APPLE_API_KEY_P8_BASE64:
        required: false
      LASMEX_APPLE_API_KEY_ID:
        required: false
      LASMEX_APPLE_API_ISSUER_ID:
        required: false
  workflow_dispatch:
    inputs:
      release:
        description: Build signed release artifacts from the matching lasmex-v* tag.
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !inputs.release }}

env:
  PRIMARY_NODE_VERSION: '24'
  LASMEX_TELEMETRY_DISABLED: '1'

jobs:
  release-context:
    name: Resolve and authorize desktop build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the exact release tag and commit for signing
        id: release
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE" != true ]; then
            exit 0
          fi
          expected_ref="refs/tags/lasmex-v$version"
          [ "$GITHUB_REF" = "$expected_ref" ] || {
            echo "::error::Signed desktop builds require $expected_ref, got $GITHUB_REF"
            exit 1
          }
          tagged_sha="$(git rev-parse "$expected_ref^{commit}")"
          [ "$GITHUB_SHA" = "$tagged_sha" ] || {
            echo "::error::$expected_ref resolves to $tagged_sha, not workflow SHA $GITHUB_SHA"
            exit 1
          }

  windows-unsigned:
    name: Windows x64 (unsigned)
    if: ${{ !inputs.release }}
    needs: release-context
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - name: Install (immutable)
        shell: pwsh
        run: pnpm install --frozen-lockfile
      - name: Verify stable distribution metadata
        shell: pwsh
        run: pnpm run release:verify-distribution
      - name: Build unsigned Windows distribution
        shell: pwsh
        run: pnpm --filter lasmex-desktop make:windows
      - name: Smoke-test Windows installer
        shell: pwsh
        run: pnpm --filter lasmex-desktop run smoke:artifact
      - name: Upload Windows distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lasmex-desktop-windows
          path: |
            apps/desktop/out/make/squirrel.windows/x64/LasmeX-Setup-${{ needs.release-context.outputs.version }}-x64.exe
            apps/desktop/out/make/squirrel.windows/x64/LasmeX-${{ needs.release-context.outputs.version }}-full.nupkg
            apps/desktop/out/make/squirrel.windows/x64/RELEASES
            apps/desktop/out/make/manifest-win32-x64.json
          if-no-files-found: error
          retention-days: 7

  windows-signed:
    name: Windows x64 (signed)
    if: ${{ inputs.release }}
    needs: release-context
    runs-on: windows-2025
    timeout-minutes: 45
    environment: desktop-signing
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - name: Install (immutable)
        shell: pwsh
        run: pnpm install --frozen-lockfile
      - name: Verify stable distribution metadata
        shell: pwsh
        run: pnpm run release:verify-distribution
      - name: Prepare Windows signing certificate
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.LASMEX_WINDOWS_CERTIFICATE_PFX_BASE64 }}
        run: |
          if (-not $env:CERTIFICATE_BASE64) { throw 'LASMEX_WINDOWS_CERTIFICATE_PFX_BASE64 is required' }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\lasmex-code-signing.pfx", [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
      - name: Build signed Windows distribution
        shell: pwsh
        env:
          LASMEX_DESKTOP_RELEASE: '1'
          LASMEX_DESKTOP_UPDATE_BASE_URL: ${{ vars.LASMEX_DESKTOP_UPDATE_BASE_URL }}
          WINDOWS_CERTIFICATE_FILE: ${{ runner.temp }}\lasmex-code-signing.pfx
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.LASMEX_WINDOWS_CERTIFICATE_PASSWORD }}
        run: pnpm --filter lasmex-desktop make:windows
      - name: Smoke-test Windows installer
        shell: pwsh
        run: pnpm --filter lasmex-desktop run smoke:artifact
      - name: Remove Windows signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath "$env:RUNNER_TEMP\lasmex-code-signing.pfx" -Force -ErrorAction SilentlyContinue
      - name: Upload Windows distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lasmex-desktop-windows
          path: |
            apps/desktop/out/make/squirrel.windows/x64/LasmeX-Setup-${{ needs.release-context.outputs.version }}-x64.exe
            apps/desktop/out/make/squirrel.windows/x64/LasmeX-${{ needs.release-context.outputs.version }}-full.nupkg
            apps/desktop/out/make/squirrel.windows/x64/RELEASES
            apps/desktop/out/make/manifest-win32-x64.json
          if-no-files-found: error
          retention-days: 7

  macos-unsigned:
    name: macOS (unsigned)
    if: ${{ !inputs.release }}
    needs: release-context
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - name: Install (immutable)
        run: pnpm install --frozen-lockfile
      - name: Verify stable distribution metadata
        run: pnpm run release:verify-distribution
      - name: Build unsigned macOS distribution
        run: pnpm --filter lasmex-desktop make:macos
      - name: Upload macOS distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lasmex-desktop-macos
          path: |
            apps/desktop/out/make/LasmeX-${{ needs.release-context.outputs.version }}-darwin-*.zip
            apps/desktop/out/make/manifest-darwin-*.json
          if-no-files-found: error
          retention-days: 7

  macos-signed:
    name: macOS (signed and notarized)
    if: ${{ inputs.release }}
    needs: release-context
    runs-on: macos-14
    timeout-minutes: 45
    environment: desktop-signing
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - name: Install (immutable)
        run: pnpm install --frozen-lockfile
      - name: Verify stable distribution metadata
        run: pnpm run release:verify-distribution
      - name: Prepare macOS signing and notarization credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.LASMEX_MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.LASMEX_MACOS_CERTIFICATE_PASSWORD }}
          API_KEY_BASE64: ${{ secrets.LASMEX_APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$CERTIFICATE_BASE64" ] || { echo '::error::LASMEX_MACOS_CERTIFICATE_P12_BASE64 is required'; exit 1; }
          [ -n "$API_KEY_BASE64" ] || { echo '::error::LASMEX_APPLE_API_KEY_P8_BASE64 is required'; exit 1; }
          certificate="$RUNNER_TEMP/lasmex-code-signing.p12"
          api_key="$RUNNER_TEMP/lasmex-notary-key.p8"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          printf '%s' "$API_KEY_BASE64" | base64 --decode > "$api_key"
          keychain="$RUNNER_TEMP/lasmex-signing.keychain-db"
          keychain_password="lasmex-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
      - name: Build signed macOS distribution
        env:
          LASMEX_DESKTOP_RELEASE: '1'
          LASMEX_DESKTOP_UPDATE_BASE_URL: ${{ vars.LASMEX_DESKTOP_UPDATE_BASE_URL }}
          LASMEX_MACOS_SIGN_IDENTITY: ${{ vars.LASMEX_MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY: ${{ runner.temp }}/lasmex-notary-key.p8
          APPLE_API_KEY_ID: ${{ secrets.LASMEX_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.LASMEX_APPLE_API_ISSUER_ID }}
        run: pnpm --filter lasmex-desktop make:macos
      - name: Remove macOS signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/lasmex-code-signing.p12" "$RUNNER_TEMP/lasmex-notary-key.p8"
          security delete-keychain "$RUNNER_TEMP/lasmex-signing.keychain-db" || true
      - name: Upload macOS distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lasmex-desktop-macos
          path: |
            apps/desktop/out/make/LasmeX-${{ needs.release-context.outputs.version }}-darwin-*.zip
            apps/desktop/out/make/manifest-darwin-*.json
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux
    needs: release-context
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - name: Install (immutable)
        run: pnpm install --frozen-lockfile
      - name: Verify stable distribution metadata
        run: pnpm run release:verify-distribution
      - name: Build Linux distribution
        env:
          LASMEX_DESKTOP_RELEASE: ${{ inputs.release && '1' || '' }}
        run: pnpm --filter lasmex-desktop make:linux
      - name: Upload Linux distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lasmex-desktop-linux
          path: |
            apps/desktop/out/make/LasmeX-${{ needs.release-context.outputs.version }}-linux-*.tar.gz
            apps/desktop/out/make/manifest-linux-*.json
          if-no-files-found: error
          retention-days: 7
