# Desktop keeps the Web composition and client roster, but replaces every
# network carrier with the app-owned lasmex:// protocol.

- id: web-startup
  disabled: true

- id: webserver
  disabled: true

- id: web-runtime
  disabled: true

- id: client-hmr
  disabled: true

- id: connection
  inject: []
  config:
    trustedHosts: []

- id: directory-picker
  disabled: true

- insert:
    - id: desktop-directory-picker
      name: 'lasmex-host-directory-picker-native'

    - id: desktop-directory-picker-ui
      name: 'lasmex-client-ui-directory-picker-native'
